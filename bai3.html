<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function tinhSoNgay() {

            let month = parseInt(prompt('tháng'));
            let year = parseInt(prompt('năm'));
            let result = "";

            let isLeapYear = false;
            if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
                isLeapYear = true;
            }


            switch (month) {
                case 1: case 3: case 5: case 7: case 8: case 10: case 12:
                    result = "Tháng " + month + " năm " + year + " có 31 ngày.";
                    break;
                case 4: case 6: case 9: case 11:
                    result = "Tháng " + month + " năm " + year + " có 30 ngày.";
                    break;
                case 2:
                    if (isLeapYear) {
                        result = "Tháng 2 năm " + year + " có 29 ngày (Năm nhuận).";
                    } else {
                        result = "Tháng 2 năm " + year + " có 28 ngày.";
                    }
                    break;
                default:
                    result = "Vui lòng nhập tháng hợp lệ (1-12).";
            }

            alert(result)
        }
        tinhSoNgay();

    </script>
</body>

</html>
