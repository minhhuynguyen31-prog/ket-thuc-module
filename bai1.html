<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<script>

const arr = [3, 5, 9, 10, 12, 15, 20, 21];

const divisibleBy3 = arr.filter(num => num % 3 === 0);

if (divisibleBy3.length === 0) {
    console.log("Không có số nào trong mảng chia hết cho 3.");
} else {
    
    const sum = divisibleBy3.reduce((acc, curr) => acc + curr, 0);
    const average = sum / divisibleBy3.length;

    console.log(`Trung bình cộng các số chia hết cho 3 là: ${average.toFixed(2)}`);
}
</script>
</body>
</html>
