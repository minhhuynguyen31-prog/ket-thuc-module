<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function isPerfectNumber(n) {
            if (n <= 1) return false;
            let sum = 0;

            for (let i = 1; i <= n / 2; i++) {
                if (n % i === 0) {
                    sum += i;
                }
            }
            return sum === n;
        }
        const userInput = parseInt(prompt("Nhập vào một số nguyên dương:"));

        if (isNaN(userInput) || userInput <= 0) {
            alert("Vui lòng nhập một số nguyên dương hợp lệ.");
        } else {
            if (isPerfectNumber(userInput)) {
                alert(`${userInput} là số hoàn hảo.`);
            } else {
                alert(`${userInput} KHÔNG phải là số hoàn hảo.`);
            }
        }
    </script>
</body>

</html>
